{% set name = "presidio-analyzer" %}
{% set version = "2.2.361" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/microsoft/presidio/archive/refs/tags/{{ version }}.tar.gz
  sha256: 3c17f3deb5cd6c36c783698ce25d37cfa68fa76d0b2c98f3901cb0a12c2832cf

build:
  noarch: python
  script: cd {{ name }} && {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core
  run:
    - python >={{ python_min }},<4
    - spacy >=3.4.4,<4.0.0,!=3.7.0
    - regex
    - tldextract
    - pyyaml
    - phonenumbers >=8.12,<9.0.0
  run_constrained: # Optional packages
    - flask >=1.1
    - spacy_huggingface_pipelines
    - stanza
    - spacy_stanza
    - azure-ai-textanalytics
    - azure-core
    - gliner >=0.2.13,<1.0.0
    - transformers
    - huggingface_hub
    - gunicorn
    - onnxruntime-gpu >=1.19

test:
  imports:
    - presidio_analyzer
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip list
    - pip check

about:
  home: https://github.com/microsoft/presidio
  summary: 'Presidio Analyzer package'
  description: |
    Presidio Analyzer package.
  license: MIT
  license_file: LICENSE
  doc_url: https://microsoft.github.io/presidio
  dev_url: https://github.com/microsoft/presidio

extra:
  recipe-maintainers:
    - phemps
    - gulyasi
    - julcsii
    - geoHeil
    - heckert
